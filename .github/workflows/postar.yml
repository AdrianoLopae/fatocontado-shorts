name: Postar no Instagram, Facebook e TikTok
on:
  schedule:
    # Brasília = UTC-3 -> 9h, 12h, 15h, 18h e 21h (mesmos horários do YouTube)
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
    - cron: "0 21 * * *"
    - cron: "0 0 * * *"
    # 11h e 17h de Brasília (horários dele desde 28/10/2026), uns minutos antes por causa do atraso do GitHub
    - cron: "52 13 * * *"
    - cron: "52 19 * * *"
    # 10h e 16h de Brasília (horários dele desde 07/11/2026)
    - cron: "52 12 * * *"
    - cron: "52 18 * * *"
    # grade de 08/11/2026: 9h, 12h e 17h de Brasília — passadas extras logo depois (o GitHub atrasa o agendado)
    - cron: "7 12 * * *"
    - cron: "23 12 * * *"
    - cron: "7 15 * * *"
    - cron: "23 15 * * *"
    - cron: "7 20 * * *"
    - cron: "23 20 * * *"
    # New Clipador (13/11/2026): 12h e 20h de Brasília (12h já coberto pelos de 15 UTC)
    - cron: "0 23 * * *"
    - cron: "7 23 * * *"
    - cron: "23 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: postar
  cancel-in-progress: false
jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python .github/robo/postar.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          NC_PAGE_TOKEN: ${{ secrets.NC_PAGE_TOKEN }}
          NC_PAGE_ID: ${{ secrets.NC_PAGE_ID }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          TT_MODO: ${{ vars.TT_MODO }}
  pagina:
    needs: postar
    uses: ./.github/workflows/pages.yml
